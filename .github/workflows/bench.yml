# Linux benchmarks on GitHub's Ubuntu runner (a VM without a GPU, under Xvfb): canbec vs the
# Chrome and Firefox the runner image ships. Runs when this file changes, or by hand.
name: bench
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/bench.yml]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libxdo-dev xvfb xdotool
      - run: cargo build --release -p canbec
      - run: dotnet publish test/engine-probe -c Release -o target/engine-probe
      - name: Run
        run: |
          python3 tools/serve.py target/engine-probe/wwwroot 5080 &
          sleep 2
          xvfb-run -a -s "-screen 0 1280x900x24" python3 tools/bench.py 5
      - name: Machine and versions
        if: always()
        run: |
          {
            lsb_release -ds; uname -r; nproc; free -m | sed -n 2p; lscpu | grep 'Model name'
            /opt/google/chrome/chrome --version; firefox --version
            dpkg -s libwebkit2gtk-4.1-0 | grep '^Version'; git rev-parse --short HEAD
          } > docs/benchmarks/linux-machine.txt 2>&1
          cat docs/benchmarks/linux-machine.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-linux
          path: docs/benchmarks/*linux*
