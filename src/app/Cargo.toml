[package]
name = "canbec"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "canbec browser: composition root wiring UI, engine and storage."

[dependencies]
canbec-domain.workspace = true
canbec-application.workspace = true
canbec-infrastructure.workspace = true
serde_json.workspace = true
url.workspace = true
wry = "0.57"
tao = "0.37"
base64 = "0.23" # already in the tree via wry; icon previews for the settings panel

# The .exe icon (build.rs). Host-gated, so it's only built when building on Windows.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

# Tracker blocking on Windows: WebView2's request filter (same crates wry uses).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

# Tracker blocking on Linux: WebKitGTK's content-filter store (same crate and version wry uses).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

# Rounded content card + Dock icon on macOS (same objc2 crates wry already uses).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString", "NSError"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSApplication", "NSImage", "NSMenu", "NSMenuItem", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-foundation"] }
block2 = "0.6"
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "WKWebView", "WKWebViewConfiguration", "WKUserContentController", "WKContentRuleList", "WKContentRuleListStore"] }
