[package]
name = "canbec"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "canbec browser: composition root wiring UI, engine and storage."

[dependencies]
canbec-domain.workspace = true
canbec-application.workspace = true
canbec-infrastructure.workspace = true
serde_json.workspace = true
wry = "0.57"
tao = "0.37"

# Rounded content card + Dock icon on macOS (same objc2 crates wry already uses).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSApplication", "NSImage", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-foundation"] }
