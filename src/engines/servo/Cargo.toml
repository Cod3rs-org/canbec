[package]
name = "canbec-servo"
version = "0.1.0"
edition = "2021"
description = "canbec's Engine port on Servo (pure Rust engine). Optional: ~143 MB, ~8 min cold build."
license = "Unlicense"
publish = false

# Not in the main workspace on purpose: Servo's dependency tree would double CI time and fill the
# shared Cargo.lock / cargo audit with hundreds of crates the default build never uses.
[workspace]

[dependencies]
canbec-application = { path = "../../application" }
canbec-domain = { path = "../../domain" }
canbec-infrastructure = { path = "../../infrastructure" }
servo = "0.1"
url = "2"
dpi = "0.1"
euclid = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
# Servo uses aws-lc-rs, our downloads use ring: with both in the tree rustls needs to be told.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
