[package]
name = "canbec-infrastructure"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Adapters: wry engine, JSON state store, blocklist download, injected scripts."

[dependencies]
canbec-domain.workspace = true
canbec-application.workspace = true
serde_json.workspace = true
url.workspace = true
wry = "0.57"
dirs = "7"
ureq = "3"
png = "0.18"
ring = "0.17" # already in the tree via rustls; seals the saved logins

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[[test]]
name = "infrastructure"
path = "../../test/infrastructure.rs"
